<!-- Magnific Popup CSS (loaded in head via custom_headers would be cleaner, but this works) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">
<!-- Map styles -->
<link href="{{ "css/map.css" | relURL }}" rel="stylesheet">

<div class="container-fluid map-container">
    <div class="map-controls">
        <button id="zoom-in" class="map-btn" title="Zoom In">+</button>
        <button id="zoom-out" class="map-btn" title="Zoom Out">-</button>
        <button id="zoom-reset" class="map-btn" title="Reset">Reset</button>
    </div>

    <div id="map-wrapper">
        <div id="map-content">
            <!-- World map SVG -->
            <img src="{{ "img/map/world.svg" | relURL }}" alt="World Map" id="world-map">

            <!-- Pins container -->
            <div id="pins-container">
                {{ $locations := .Site.Data.locations.locations }}
                {{ range $locations }}
                <div class="map-pin"
                     data-id="{{ .id }}"
                     data-name="{{ .name }}"
                     data-images='{{ .images | jsonify }}'
                     style="left: {{ .x }}%; top: {{ .y }}%;">
                    <div class="pin-stem"></div>
                    <div class="pin-head"></div>
                    <div class="pin-tooltip">{{ .name }}</div>
                </div>
                {{ end }}
            </div>
        </div>
    </div>
</div>

<!-- Panzoom library -->
<script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
<!-- Magnific Popup -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
<!-- Map functionality -->
<script src="{{ "js/map.js" | relURL }}"></script>
